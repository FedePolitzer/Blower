  <text x="960" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#475569" text-anchor="middle">PLATAFORMAS</text>
  <text x="960" y="472" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#f1f5f9" text-anchor="middle">Meta Ads</text>

