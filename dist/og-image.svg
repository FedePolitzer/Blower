  <!-- Meta Business Partner badge -->
  <rect x="466" y="72" width="268" height="34" rx="17" fill="#60a5fa" fill-opacity="0.08" stroke="#60a5fa" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="487" cy="89" r="5" fill="url(#textGrad)"/>
  <text x="500" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#93c5fd" text-anchor="start">META BUSINESS PARTNER</text>

